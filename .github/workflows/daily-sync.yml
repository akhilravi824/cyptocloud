name: Daily paper sync (BTC + ETH Signal -> Alpaca paper)

on:
  schedule:
    - cron: "10 * * * *"    # every hour at :10. Decisions use only FINISHED daily closes, so the first run after
                             # the 00:00 UTC close trades if the signal changed; the other runs find nothing to do
                             # and act as backups if GitHub delays or skips a run. One email per daily close.
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: read             # the job can only read this repo, never change it
  issues: write              # posts the daily/weekly portfolio report (GitHub emails it)

concurrency:
  group: paper-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Sync the Alpaca paper account to today's signal
        run: python3 -I cloud_sync.py   # standard library only, so the runner's built-in Python is enough
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
