name: Keep the daily schedule switched on

# GitHub switches off scheduled workflows in a public repo after 60 days without commits.
# This adds one empty commit a month so the daily paper sync never stops on its own.

on:
  schedule:
    - cron: "30 0 1 * *"     # 00:30 UTC on the 1st of every month
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write            # needed only to add the empty commit

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Add an empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Monthly keepalive: keep the daily schedule switched on"
          git push
